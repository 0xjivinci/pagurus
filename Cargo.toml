[package]
name = "pagurus"
version = "0.1.0"
edition = "2021"
description = "A small, self-improving personal AI agent in one binary, inspired by Hermes Agent: memory, self-written skills, scheduled checks"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xjivinci/pagurus"
readme = "README.md"
keywords = ["agent", "ai", "llm", "raspberry-pi", "telegram"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP + rustls: no async runtime, no OpenSSL to cross-compile.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Already linked through ureq (same versions and features); used directly for
# the Discord/Slack WebSocket and IMAP/SMTP connections.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
webpki-roots = "0.26"
# HMAC, HKDF and X25519 for peer pairing; already linked through rustls.
ring = "0.17"
# `sqlite` feature: session search on SQLite FTS5 (compiled in, no system library).
rusqlite = { version = "0.32", default-features = false, features = ["bundled"], optional = true }

[features]
# The small build ("pagurus"): a tiny built-in index for session_search.
default = []
sqlite = ["dep:rusqlite"]
# Crypto-art research for collectors and artists (Tezos via objkt; read-only).
art = []
# "uge": the big build for laptops and servers: every optional feature.
uge = ["sqlite", "art"]
# The older name for the big build.
full = ["uge"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
